  - source: {alertname: CheckoutErrorRate, service: checkout, severity: P1, system: shop}
    target: {alertname: FrontendLatencyP99, service: frontend, severity: P2, system: shop}
    inhibited: true
  - source: {alertname: CheckoutErrorRate, service: checkout, severity: P1, system: shop}
    target: {alertname: FrontendLatencyP99, service: frontend, severity: P2, system: other}
    inhibited: false
  # A shop page mutes the shop's P3 cause hints too.
