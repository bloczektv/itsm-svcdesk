# Course template - Lab 1 compose contract (API.md section 9).
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on any service, and images that need
# no network once built (dependencies are installed at build time, never at start).
services:
  svcdesk:
    build: .                      # copy Dockerfile.example to Dockerfile, or write your own
    ports:
      - "8080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080   # Lab 3, M-02; the code falls back to this value when unset
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Lab 3 (M-01): the upstream knowledge-base index. The checker replaces image and login with its own.
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: bloczektv             # my GitHub login, the one my receipts carry
    ports:
      - "8081:8080"                             # /stats and /admin/degrade from the laptop
    # No healthcheck: the image has no shell, so a command check never passes (L3-CORE-1.04).

  # Lab 3: my own Prometheus (:9090) and Grafana (:3000). The checker never starts them, so they may
  # bind-mount their configuration:  docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Lab 3, Stretch 2 (M-30): Toxiproxy in front of svcdesk.  docker compose --profile gap up -d toxiproxy
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "8474:8474"                             # the API
      - "8666:8666"                             # the proxy in front of svcdesk

  # Stretch S3 (own tests). The checker builds every image up front
  # (docker compose --profile tests build), then runs
  #   docker compose --profile tests run --rm --build tests
  # (300 s cap) and requires exit code 0 and a last stdout line "ITSMLAB-TESTS: passed=<n> failed=0" with n >= 10.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080   # tests read the service URL from this variable
    command: ["python", "-m", "tests.run"]

volumes:
  svcdesk-data:
